<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Kick</title>
    <link rel="icon" href="https://5a3864bbc6.cbaul-cdnwnd.com/a5752067f9d5fdee0a74b486f3ae9c23/200000099-a11d7a11d8/LOGO%20OTALDOTROIA.jpeg?ph=5a3864bbc6" type="image/jpeg">

    <style>
        :root {
            --kick-green: #53FC18;
            --kick-dark-green: #48d915;

            /* Light Theme Vars */
            --bg-color: #f0f0f5;
            --form-bg-color: white;
            --text-color: #333;
            --label-color: #555;
            --border-color: #ccc;
        }

        body.dark-mode {
            /* Dark Theme Vars */
            --bg-color: #121212;
            --form-bg-color: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #bbb;
            --border-color: #444;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        form {
            max-width: 600px;
            margin: auto;
            background: var(--form-bg-color);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-top: 5px solid var(--kick-green);
        }

        .form-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-header img {
            max-width: 200px;
            margin-bottom: 10px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--label-color);
        }

        input[type="text"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--form-bg-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 16px;
        }

        input:focus {
            border-color: var(--kick-green);
            outline: none;
        }

        .button-container {
            text-align: center;
        }

        button[type="submit"] {
            background-color: var(--kick-green);
            color: #1a1a1a;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: var(--kick-dark-green);
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--label-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Theme Switcher Button */
        .theme-switcher-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        #theme-toggle {
            background: var(--form-bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #theme-toggle:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="theme-switcher-container">
        <button id="theme-toggle">🌙</button>
    </div>

    <form action="/cadastro/kick" method="post">
        <div class="form-header">
            <img 
                src="https://5a3864bbc6.cbaul-cdnwnd.com/a5752067f9d5fdee0a74b486f3ae9c23/200000099-a11d7a11d8/LOGO%20OTALDOTROIA.jpeg?ph=5a3864bbc6" 
                alt="Logo do Canal" >
            <h1>Cadastrar Live da Kick</h1>
        </div>
        
        <div class="form-group">
            <label for="data_transmissao">Data da Transmissão:</label>
            <input type="date" id="data_transmissao" name="data_transmissao" required>
        </div>

        <div class="form-group">
            <label for="horas_transmitidas">Horas Transmitidas (ex: 04:15):</label>
            <input type="text" id="horas_transmitidas" name="horas_transmitidas" required>
        </div>

        <div class="form-group">
            <label for="inscricoes_novas">Novas Inscrições (Subs):</label>
            <input type="number" id="inscricoes_novas" name="inscricoes_novas" value="0">
        </div>

        <div class="form-group">
            <label for="seguidores_novos">Novos Seguidores:</label>
            <input type="number" id="seguidores_novos" name="seguidores_novos" value="0">
        </div>

        <div class="form-group">
            <label for="conteudo">Conteúdo Principal:</label>
            <input type="text" id="conteudo" name="conteudo">
        </div>
        
        <div class="button-container">
            <button type="submit">Cadastrar</button>
        </div>
    </form>

    <a href="/">Voltar para a página inicial</a>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;

        // Função para aplicar o tema com base no localStorage
        const applyTheme = () => {
            if (localStorage.getItem('theme') === 'dark') {
                body.classList.add('dark-mode');
                themeToggle.textContent = '☀️'; // Ícone de sol para modo escuro
            } else {
                body.classList.remove('dark-mode');
                themeToggle.textContent = '🌙'; // Ícone de lua para modo claro
            }
        };

        // Event listener para o clique no botão
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }

            applyTheme(); // Atualiza o ícone do botão
        });

        // Aplica o tema salvo quando a página carrega
        document.addEventListener('DOMContentLoaded', applyTheme);
    </script>

</body>
</html>
