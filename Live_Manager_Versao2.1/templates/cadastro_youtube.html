<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro YouTube</title>
    <link rel="icon" href="https://5a3864bbc6.cbaul-cdnwnd.com/a5752067f9d5fdee0a74b486f3ae9c23/200000099-a11d7a11d8/LOGO%20OTALDOTROIA.jpeg?ph=5a3864bbc6" type="image/jpeg">
    <style>
        :root {
            --youtube-red: #ff0000;
            --bg-color: #f9f9f9;
            --form-bg: white;
            --text-color: #333;
            --label-color: #555;
            --border-color: #ccc;
        }
        body.dark-mode {
            --bg-color: #121212;
            --form-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #bbb;
            --border-color: #444;
        }
        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        form {
            max-width: 600px;
            margin: auto;
            background: var(--form-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-top: 5px solid var(--youtube-red);
        }
        .form-header { text-align: center; margin-bottom: 20px; }
        .form-header img { max-width: 200px; margin-bottom: 10px; border-radius: 15px; }
        h1 { text-align: center; color: var(--youtube-red); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--label-color); }
        
        /* ATUALIZADO: Incluído input[type="number"] para garantir a formatação correta */
        input[type="text"], input[type="date"], input[type="time"], input[type="number"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--form-bg);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 16px;
        }

        /* REMOVE AS SETINHAS (SPINNERS) DOS CAMPOS NÚMERICOS */
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        input:focus { border-color: var(--youtube-red); outline: none; }
        .button-container { text-align: center; }
        button { background-color: var(--youtube-red); color: white; padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #cc0000; }
        a { display: block; text-align: center; margin-top: 20px; color: var(--label-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .theme-switcher-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        #theme-toggle {
            background: var(--form-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        #theme-toggle:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="theme-switcher-container">
    <button id="theme-toggle">🌙</button>
</div>

<form action="/cadastro/youtube" method="post">
    <div class="form-header">
        <img src="https://5a3864bbc6.cbaul-cdnwnd.com/a5752067f9d5fdee0a74b486f3ae9c23/200000099-a11d7a11d8/LOGO%20OTALDOTROIA.jpeg?ph=5a3864bbc6" alt="Logo do Canal">
        <h1>Cadastrar Live do YouTube</h1>
    </div>

    <div class="form-group">
        <label for="titulo">Título da Live</label>
        <input type="text" id="titulo" name="titulo" required>
    </div>
    <div class="form-group">
        <label for="data">Data da Transmissão</label>
        <input type="date" id="data" name="data" required>
    </div>
    <div class="form-group">
        <label for="horario">Horas Transmitidas</label>
        <input type="time" id="horario" name="horario" required>
    </div>
    <div class="form-group">
        <label for="Visualizacoes">Visualizações</label>
        <input type="number" id="Visualizacoes" name="Visualizacoes" required>
    </div>
     <div class="form-group">
        <label for="Media">Média de Visualizações</label>
        <input type="number" id="Media" name="Media" required>
    </div>
    <div class="form-group">
        <label for="Picos">Picos Simultâneos</label>
        <input type="number" id="picos" name="picos" required>
    </div>
    <div class="form-group">
        <label for="Likes">Likes</label>
        <input type="number" id="likes" name="likes" required>
    </div>

    <div class="button-container">
        <button type="submit">Cadastrar</button>
    </div>
</form>
<a href="/">Voltar para a página inicial</a>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    const applyTheme = () => {
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        } else {
            body.classList.remove('dark-mode');
            themeToggle.textContent = '🌙';
        }
    };
    themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark-mode');
        localStorage.setItem('theme', body.classList.contains('dark-mode') ? 'dark' : 'light');
        applyTheme();
    });
    document.addEventListener('DOMContentLoaded', applyTheme);
</script>

</body>
</html>
