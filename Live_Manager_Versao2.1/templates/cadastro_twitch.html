<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Twitch</title>
    <!-- Favicon com link direto -->
    <link rel="icon" href="https://5a3864bbc6.cbaul-cdnwnd.com/a5752067f9d5fdee0a74b486f3ae9c23/200000099-a11d7a11d8/LOGO%20OTALDOTROIA.jpeg?ph=5a3864bbc6" type="image/jpeg">
    <style>
        :root {
            --twitch-purple: #6441a5;
            --bg-color: #f0f0f5;
            --form-bg: white;
            --text-color: #333;
            --label-color: #555;
            --border-color: #ccc;
        }
        body.dark-mode {
            --bg-color: #121212;
            --form-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #bbb;
            --border-color: #444;
        }
        body { 
            font-family: sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 20px; 
            transition: background-color 0.3s, color 0.3s;
        }
        form { 
            max-width: 600px; 
            margin: auto; 
            background: var(--form-bg); 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            border-top: 5px solid var(--twitch-purple); 
        }
        .form-header { text-align: center; margin-bottom: 20px; }
        .form-header img { max-width: 200px; margin-bottom: 10px; border-radius: 15px; }
        h1 { text-align: center; color: var(--twitch-purple); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--label-color); }
        
        /* Estilo unificado para todos os inputs */
        input[type="text"], input[type="date"], input[type="number"], input[type="time"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            background-color: var(--form-bg);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 16px;
        }

        /* REMOVE AS SETINHAS (SPINNERS) DOS CAMPOS NÚMERICOS */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        input:focus { border-color: var(--twitch-purple); outline: none; }
        .button-container { text-align: center; }
        button { background-color: var(--twitch-purple); color: white; padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; transition: background-color 0.2s; }
        button:hover { background-color: #523486; }
        a { display: block; text-align: center; margin-top: 20px; color: var(--label-color); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .theme-switcher-container { position: fixed; top: 20px; right: 20px; z-index: 100; }
        #theme-toggle { background: var(--form-bg); border: 1px solid var(--border-color); color: var(--text-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 22px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        #theme-toggle:hover { opacity: 0.8; }
    </style>
</head>
<body>

<div class="theme-switcher-container">
    <button id="theme-toggle">🌙</button>
</div>

<form action="/cadastro/twitch" method="post">
    <div class="form-header">
        <!-- Logo corrigida para o link direto -->
        <img src="https://5a3864bbc6.cbaul-cdnwnd.com/a5752067f9d5fdee0a74b486f3ae9c23/200000099-a11d7a11d8/LOGO%20OTALDOTROIA.jpeg?ph=5a3864bbc6" alt="Logo do Canal">
        <h1>Cadastrar Live da Twitch</h1>
    </div>

    <div class="form-group">
        <label for="data_transmissao">Data da Transmissão</label>
        <input type="date" id="data_transmissao" name="data_transmissao" required>
    </div>
    <div class="form-group">
        <label for="horas_transmitidas">Horas Transmitidas</label>
        <input type="time" id="horas_transmitidas" name="horas_transmitidas" required>
    </div>
    <div class="form-group">
        <label for="visualizacoes">Média de Visualizações</label>
        <!-- Mudado para type="text" para permitir vírgula. inputmode="decimal" abre teclado numérico no celular -->
        <input type="text" id="visualizacoes" name="visualizacoes" inputmode="decimal" placeholder="0,0" required>
    </div>
    <div class="form-group">
        <label for="seguidores_novos">Novos Seguidores</label>
        <input type="number" id="seguidores_novos" name="seguidores_novos" required>
    </div>
    <div class="form-group">
        <label for="subscribers_novos">Novos Subscribers</label>
        <input type="number" id="subscribers_novos" name="subscribers_novos" required>
    </div>
    <div class="form-group">
        <label for="conteudo">Conteúdo Realizado</label>
        <input type="text" id="conteudo" name="conteudo">
    </div>
    <div class="form-group">
        <label for="minutos_assistidos">Minutos Assistidos</label>
        <input type="number" id="minutos_assistidos" name="minutos_assistidos" required>
    </div>
    <div class="form-group">
        <label for="espectadores_unicos">Espectadores Únicos</label>
        <input type="number" id="espectadores_unicos" name="espectadores_unicos" required>
    </div>
    
    <!-- Campos de Moeda com máscara JS -->
    <div class="form-group">
        <label for="donates_brl">Donates (BRL)</label>
        <input type="text" id="donates_brl" name="donates_brl" placeholder="R$ 0,00" oninput="formatCurrency(this, 'R$')">
    </div>
    <div class="form-group">
        <label for="valor_usd">Valor Recebido (USD)</label>
        <input type="text" id="valor_usd" name="valor_usd" placeholder="US$ 0,00" oninput="formatCurrency(this, 'US$')">
    </div>

    <div class="button-container">
        <button type="submit">Cadastrar</button>
    </div>
</form>

<a href="/">Voltar para a página inicial</a>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;
    const applyTheme = () => {
        if(localStorage.getItem('theme') === 'dark'){
            body.classList.add('dark-mode');
            themeToggle.textContent = '☀️';
        } else {
            body.classList.remove('dark-mode');
            themeToggle.textContent = '🌙';
        }
    };
    themeToggle.addEventListener('click', ()=>{
        body.classList.toggle('dark-mode');
        localStorage.setItem('theme', body.classList.contains('dark-mode')?'dark':'light');
        applyTheme();
    });
    document.addEventListener('DOMContentLoaded', applyTheme);

    function formatCurrency(input, symbol) {
        let value = input.value.replace(/\D/g, '');
        if (value === "") {
            input.value = "";
            return;
        }
        value = (parseInt(value) / 100).toFixed(2);
        value = value.replace('.', ',');
        input.value = symbol + ' ' + value;
    }
</script>

</body>
</html>
