<!DOCTYPE html>
<html>
<head><title>Cadastrar Live Twitch</title></head>
<body>
<h1>Cadastrar Live Twitch</h1>
<form method="post">
    Data: <input type="date" name="data_transmissao"><br>
    Horas transmitidas: <input type="text" name="horas_transmitidas"><br>
    Visualizações: <input type="number" name="visualizacoes"><br>
    Seguidores novos: <input type="number" name="seguidores_novos"><br>
    Subscribers novos: <input type="number" name="subscribers_novos"><br>
    Conteúdo: <input type="text" name="conteudo"><br>
    Valor ganho (USD): <input type="number" step="0.01" name="valor_usd"><br>
    Donates (BRL): <input type="number" step="0.01" name="donates_brl"><br>
    Minutos assistidos: <input type="number" name="minutos_assistidos"><br>
    Espectadores únicos: <input type="number" name="espectadores_unicos"><br>
    <input type="submit" value="Salvar">
</form>
<a href="/">Voltar</a>
</body>
</html>
